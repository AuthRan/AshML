# What CI can honestly check, and what it cannot.
#
# Phase 0 listed "CI skeleton" as delivered and there was no CI. This is it, and its
# scope is chosen by the same rule as everything else here: run the checks that are
# genuinely real in this environment, and say plainly which ones are not.
#
# **It runs the integration tests, not only the unit tests.** They are the ones that
# would otherwise rot, because they skip silently on a machine with no database — which
# is exactly what a CI runner is unless somebody gives it one. Postgres and MinIO come up
# as service containers, so `pass` here means the SQL ran, the queue's `SKIP LOCKED`
# behaved, and an artifact upload was confirmed against a real bucket.
#
# **It runs one thing that needs Kubernetes, and only one.** An earlier version of this
# file said CI could run nothing that needed a cluster, on the grounds that "the thing
# those scripts test is the behaviour of a cluster under load, and a shared runner is not
# one". That is true of some of them and was applied to all of them, which was too broad —
# and the cost of being too broad is that the project's *headline* claim, the Phase 2 exit
# criterion, was verified only when its author remembered to run it.
#
# So `make e2e` runs here, in the `e2e` job below, and `make e2e-isolation` beside it. What it asserts does not depend on the
# runner resembling a real cluster: a job submitted through the API becomes a Kubernetes
# Job, runs a real container, and reaches SUCCEEDED through *observed Pod status* — with
# every claim cross-checked against `kubectl`, so a pass cannot be produced by the control
# plane merely believing itself. A two-core hosted runner answers that question exactly as
# well as a workstation does.
#
# The rest stay out, and now for reasons specific to each rather than one blanket one.
# `make e2e-scheduler` overfills the cluster and is written against the capacity the
# development machine has; `make e2e-rollout` measures a traffic split across pods and
# needs ~2 GB of PyTorch images; the chaos scripts kill pods and assert on recovery timing;
# `make journey` needs all four images and CIFAR-10. Those remain a thing a person runs
# against the development cluster, and the roadmap says so rather than a green tick
# implying coverage that is not there.
#
# **There is no GPU here either**, so nothing in CI touches the NVIDIA provider. That is
# the same limitation the whole project has (ADR 0008) and is stated rather than papered
# over: `ASHML_GPU_PROVIDER` is left at its `sim` default in the unit suite, which is
# opt-in and labels its output as fabricated (spec Rule 5).

name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # The integration suites are slow on purpose — they talk to a real database and a real
    # bucket, and a few of them drive the executor through several of its poll intervals.
    # Generous, but far below the six-hour default, so a hang is a failed job within the
    # hour rather than a runner held all afternoon.
    timeout-minutes: 30

    services:
      # Matches deploy/local/docker-compose.yml. The health check is not optional: the
      # test suite's first act is to TRUNCATE, and a database that is listening but not
      # ready produces a failure that reads like a schema problem.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ashml
          POSTGRES_PASSWORD: ashml
          POSTGRES_DB: ashml
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ashml -d ashml"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # The dedicated test database, which the suite wipes. `test-support/db.js` refuses
      # to run against a database whose name does not say it is for testing, so this name
      # is load-bearing rather than decorative.
      ASHML_TEST_DATABASE_URL: postgresql://ashml:ashml@127.0.0.1:5432/ashml_test
      ASHML_S3_ENDPOINT: http://127.0.0.1:9000
      ASHML_S3_ACCESS_KEY: ashml
      ASHML_S3_SECRET_KEY: ashml-dev-secret

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      # `ci` rather than `install`: the lockfile is the input, and a run that silently
      # resolved a different tree from the one committed is testing something else.
      - run: npm ci

      # The artifact tests skip without a bucket rather than substituting a fake, because
      # "did these bytes actually land" is the one question a fake store cannot answer
      # (spec Rule 5). Giving CI a real one is what stops that skip becoming permanent.
      #
      # `docker run`, not a `services:` entry, and the reason is the same one that made
      # the first version of this file wrong. MinIO needs an argument -- `server /data` --
      # and a service container has nowhere to put one: it can override the environment
      # and the entrypoint flags, never the command. The original way round that was
      # `bitnami/minio`, which reads its configuration from the environment and needs no
      # argument; then Bitnami withdrew its public Docker Hub tags and `latest` stopped
      # resolving, which is how a workflow that had never had a remote to run on failed
      # on its first push. So this uses the same image as
      # `deploy/local/docker-compose.yml` -- one artifact store definition for the
      # workstation and for CI, rather than two that can drift apart quietly.
      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=ashml \
            -e MINIO_ROOT_PASSWORD=ashml-dev-secret \
            minio/minio:latest server /data
          # Wait for it rather than assuming: the artifact suites' first act is to create
          # a bucket, and a store that is listening but not serving yet fails in a way
          # that reads like a credentials problem.
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null 2>&1; then
              echo "minio ready after ${i} attempt(s)"; exit 0
            fi
            sleep 2
          done
          echo "minio never became ready" >&2
          docker logs minio >&2 || true
          exit 1

      - name: Create and migrate the test database
        run: |
          node scripts/create-test-db.mjs
          ASHML_DATABASE_URL="$ASHML_TEST_DATABASE_URL" npm run migrate up

      - run: npm run lint

      # Unit and integration together, which is what `npm test` means here. With the
      # services above, none of the integration suites skip — and a skip is what this job
      # exists to prevent, since it is indistinguishable from a pass in a summary line.
      #
      # `pipefail` so the suite's exit code survives the pipe, and the output is kept so
      # the check below can read it rather than running the whole suite a second time.
      - name: Unit and integration tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt

      - name: Fail if an integration suite skipped for want of a service
        # A skipped suite is neither a pass nor a failure, so a run where Postgres never
        # came up is green and says nothing. This is the assertion that the services were
        # actually there — without it, the most valuable half of this job can quietly
        # stop running and nobody finds out.
        run: |
          if grep -q "PostgreSQL not reachable" test-output.txt; then
            echo "::error::Integration tests skipped — the Postgres service was not reachable."
            echo "They are the point of this job, so a skip is a failure here."
            exit 1
          fi
          echo "Integration suites ran against the service containers."

  # ------------------------------------------------------------------ e2e

  e2e:
    name: Kubernetes end-to-end (k3d)
    runs-on: ubuntu-latest

    # A cluster, an image build and a real container. Well under the `test` job's
    # allowance, because if this one is still going after twenty minutes something has
    # hung rather than been slow.
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ashml
          POSTGRES_PASSWORD: ashml
          POSTGRES_DB: ashml
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ashml -d ashml"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      ASHML_DATABASE_URL: postgresql://ashml:ashml@127.0.0.1:5432/ashml
      # No bucket in this job, and none needed: the Phase 2 smoke workload writes no
      # artifacts. `none` is the honest description of a control plane with no store
      # rather than a simulation of one, so this is a statement about the job, not a
      # substitution — and if the script ever starts uploading, it fails loudly here
      # instead of quietly asserting against a fake.
      ASHML_ARTIFACT_STORE: none
      # The GPUs are not what is under test; the cluster very much is. `e2e.mjs` sets
      # both itself, and they are repeated here so a reader of this file can see what
      # this job is and is not claiming.
      ASHML_GPU_PROVIDER: sim
      ASHML_K8S_BACKEND: kubernetes

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Pinned, and installed from the project's own release rather than through a
      # third-party action: a workflow that pipes an unpinned script into a shell is one
      # upstream commit away from running something nobody reviewed, and the same is true
      # of an action referenced by a moving tag.
      - name: Install k3d
        env:
          K3D_VERSION: v5.8.3
        run: |
          curl -fsSL "https://raw.githubusercontent.com/k3d-io/k3d/${K3D_VERSION}/install.sh" \
            | TAG="${K3D_VERSION}" bash
          k3d version

      # `make cluster` rather than a hand-written `k3d cluster create`, so the cluster CI
      # asserts against is the same one a reader gets from the README's quick start —
      # same k3s version, same node count, same disabled ingress. Two definitions that
      # can drift is how a green tick stops describing the thing anybody runs.
      - name: Create the cluster
        run: make cluster

      # Builds the smoke image and imports it into the k3d nodes' containerd. The import
      # is not optional: a k3d node cannot see the host daemon, so without it every Pod
      # sits in ErrImagePull and the failure reads like a registry problem.
      - name: Build and import the smoke workload image
        run: make image

      - name: Migrate
        run: npm run migrate up

      # The Phase 2 exit criterion, asserted against `kubectl` as well as against AshML's
      # own view — which is what makes it evidence rather than a self-report.
      - name: End-to-end against k3d
        run: make e2e

      # Here for the same reason, and it passes the same test: what it asserts does not
      # depend on the runner resembling a real cluster. It asks whether a pod in one
      # project can open a socket to a pod in another, by running `wget` inside a real
      # container — a question about the CNI, which a two-core runner has as much of as a
      # workstation does. It needs no built image: busybox serves the page and fetches it.
      #
      # And it is worth CI's minutes precisely because it cannot be checked any other way.
      # A NetworkPolicy is an object every cluster accepts and only some enforce, so a
      # unit test on the manifest would stay green through a regression that removed the
      # isolation entirely.
      - name: Per-project network isolation against k3d
        run: make e2e-isolation

      # Only on failure, and worth the lines: a red tick that says "timed out waiting for
      # SUCCEEDED" and nothing else costs a full re-run to learn anything from.
      - name: What the cluster thought
        if: failure()
        run: |
          kubectl --context k3d-ashml get nodes -o wide || true
          # Across all namespaces, not `-n ashml-jobs`: since ADR 0019 a job runs in its
          # project's own namespace, and a failing run's pods are in one of those. Pinning
          # these to the shared namespace prints nothing at exactly the moment somebody
          # needs them, which is worse than not having them — it reads as "no pods".
          kubectl --context k3d-ashml get ns -l app.kubernetes.io/managed-by=ashml || true
          kubectl --context k3d-ashml get jobs,pods -A -l app.kubernetes.io/managed-by=ashml -o wide || true
          kubectl --context k3d-ashml get networkpolicy -A -o yaml || true
          kubectl --context k3d-ashml describe pods -A -l app.kubernetes.io/managed-by=ashml || true
          kubectl --context k3d-ashml logs -A --all-containers --tail=100 -l app.kubernetes.io/managed-by=ashml || true
