# Prometheus itself: the identity it scrapes with, where it keeps its data, and how it
# is reached.
#
# One replica and no high availability, deliberately. Two Prometheus instances scraping
# the same targets is the standard HA answer and it needs deduplication downstream to
# stop every graph showing two of everything; on a single-node k3d cluster the second
# replica would fail with the first machine anyway.
---
# The ServiceAccount exists for exactly one privilege: reading the kubelets' cAdvisor
# metrics through the API server proxy. It cannot read Secrets, ConfigMaps, or anything
# a workload put in the cluster — a monitoring identity is a standing credential, and the
# reason to keep it narrow is that it is never rotated by anything.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: ashml-observability
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: ashml
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ashml-prometheus
  labels:
    app.kubernetes.io/part-of: ashml
rules:
  # `nodes` for service discovery — Prometheus has to know which kubelets exist before
  # it can scrape them. `nodes/metrics` is the proxy subresource that carries cAdvisor.
  - apiGroups: ['']
    resources: [nodes, nodes/metrics, nodes/proxy]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ashml-prometheus
  labels:
    app.kubernetes.io/part-of: ashml
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ashml-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: ashml-observability
---
# A PersistentVolumeClaim rather than an emptyDir, because history is the entire product
# here: a Prometheus that loses its samples on a pod restart can answer "what is happening
# now", which is the one question you could have answered by looking. k3d ships the
# local-path provisioner, so this binds without anything else being installed.
#
# Note the asymmetry with Grafana below, which *does* use an emptyDir. That is not an
# oversight: Grafana's dashboards and datasources are provisioned from files in this
# repository, so it holds nothing that is not already in git. Prometheus holds the only
# copy of every sample it has taken.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: ashml-observability
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: ashml
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 8Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: ashml-observability
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: ashml
spec:
  replicas: 1
  # Recreate, not RollingUpdate: the PVC is ReadWriteOnce, so a second pod would sit
  # Pending waiting for a volume the first one still holds, and the rollout would never
  # finish. A few seconds of gap in the graphs is the honest cost.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/part-of: ashml
      annotations:
        # Rolls the pod when the scrape config changes. Without it, `kubectl apply` of a
        # new ConfigMap updates the file eventually and the running Prometheus keeps the
        # old config until someone notices — a silent no-op is the worst outcome for a
        # change nobody can see the effect of.
        ashml.io/config-hash: replaced-by-make
    spec:
      serviceAccountName: prometheus
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v3.14.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            # Fifteen days on an 8Gi volume with this series count is not a constraint;
            # it is here so that retention is a decision on the record rather than
            # whatever the default happens to be in the next version.
            - --storage.tsdb.retention.time=15d
            - --web.enable-lifecycle
          ports:
            - name: http
              containerPort: 9090
          # Liveness on /-/healthy and readiness on /-/ready, which is the same split the
          # model server makes and for the same reason: replaying a write-ahead log after
          # an unclean shutdown makes Prometheus not-ready for a while, and a liveness
          # probe on readiness would kill it mid-replay and start the replay again. The
          # startup probe is what keeps liveness from counting during that replay at all.
          startupProbe:
            httpGet: { path: /-/ready, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /-/ready, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /-/healthy, port: http }
            periodSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus/prometheus.yml, subPath: prometheus.yml }
            - { name: rules, mountPath: /etc/prometheus/rules }
            - { name: data, mountPath: /prometheus }
      volumes:
        - name: config
          configMap: { name: prometheus-config }
        - name: rules
          configMap: { name: prometheus-rules }
        - name: data
          persistentVolumeClaim: { claimName: prometheus-data }
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: ashml-observability
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: ashml
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
