# Credentials for Grafana: its own admin account, and the PostgreSQL datasource's login.
#
# Kept in a file of its own so `make observability` can apply it and override values in it
# *before* the Deployment is created. Folding it into the Deployment's file meant the
# override arrived after the pod had already started with the committed default, and the
# repair was a rollout restart that produced a second ReplicaSet on the very first deploy.
# Development defaults, committed to the repository.
#
# These are the same defaults as `deploy/local/docker-compose.yml` — `ashml`/`ashml` on a
# database that only exists on a developer's machine. Committing them is a decision, not
# an accident: a placeholder that has to be filled in before anything works makes the
# quick start a puzzle, and the honest description of this cluster is that it has no
# secrets worth keeping. Phase 10 authenticated the control-plane API; it did *not* touch
# these. Grafana's own credentials, and getting them out of git, are still open.
#
# A database somewhere else does not need this file edited:
# `make observability GRAFANA_PG_ADDR=host.k3d.internal:55432` overrides it, and the
# override is part of what the Grafana pod's template hash is computed from, so changing
# it rolls the pod that reads it.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-datasource-credentials
  namespace: ashml-observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: ashml
type: Opaque
stringData:
  # `host.k3d.internal` is the workstation as seen from inside k3d — the same address the
  # control plane advertises to training pods. The database runs beside the control plane,
  # not in the cluster.
  ASHML_PG_ADDR: host.k3d.internal:5432
  ASHML_PG_DATABASE: ashml
  ASHML_PG_USER: ashml
  ASHML_PG_PASSWORD: ashml
  GF_SECURITY_ADMIN_USER: admin
  GF_SECURITY_ADMIN_PASSWORD: ashml
