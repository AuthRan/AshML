# A training job manifest. Submit with:
#   ash job submit examples/training/resnet-cifar.yaml
#
# Sized for a single RTX 2080 Ti (11 GB). The platform is what is being tested
# here, not the model (spec §35).

project: vision
name: resnet-cifar

# Optional. Attributes this run to an experiment, which is what carries the commit,
# image digest, dataset version and seed. Pass `--experiment <id>` to override it, or
# create one with: ash experiment create <name> --dataset cifar10 --dataset-version v1
# experiment: 00000000-0000-0000-0000-000000000000

priority: MEDIUM
max_retries: 2

resources:
  cpu: 8
  memory_bytes: 34359738368      # 32 GiB
  gpu: 1
  gpu_memory_min_bytes: 8589934592  # 8 GiB

spec:
  # A digest, not a tag, is what makes a run reproducible — this tag is a placeholder
  # until Phase 2 builds real training images.
  image: ash/ml-pytorch:latest
  command:
    - python
    - train.py
  args:
    - --epochs=50
    - --batch-size=128
    - --lr=0.001
  env:
    DATASET: cifar10
    DATASET_VERSION: v3
