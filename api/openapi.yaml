openapi: 3.1.0
info:
  title: AshML API
  description: Control-plane API for the AshML Kubernetes-native GPU ML platform.
    Generated from the route schemas — do not edit by hand.
  version: 0.1.0-dev
components:
  schemas:
    def-0:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Stable, machine-readable error code
            message:
              type: string
      title: Error
    def-1:
      type: object
      required:
        - provider
        - index
        - uuid
        - model
        - memory_total_bytes
        - memory_used_bytes
        - memory_free_bytes
        - utilization_pct
        - health
        - simulated
      properties:
        provider:
          type: string
          description: Provider that discovered this device
        index:
          type: integer
          minimum: 0
        uuid:
          type: string
        model:
          type: string
        memory_total_bytes:
          type: integer
          minimum: 0
        memory_used_bytes:
          type: integer
          minimum: 0
        memory_free_bytes:
          type: integer
          minimum: 0
        utilization_pct:
          type: integer
          minimum: 0
          maximum: 100
        temperature_c:
          type: integer
        power_watts:
          type: number
        health:
          type: string
          enum:
            - OK
            - DEGRADED
            - FAILED
            - UNKNOWN
        simulated:
          type: boolean
          description: "True when this device is fabricated rather than real hardware.
            Never hide this: the spec forbids passing simulated telemetry off as
            real (Rule 5)."
      title: GpuDevice
    def-2:
      type: object
      required:
        - id
        - name
        - created_at
        - quota
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        created_at:
          type: string
          format: date-time
        quota:
          type: object
          required:
            - gpu
            - cpu
            - memory_bytes
            - jobs
          properties:
            gpu:
              type: integer
            cpu:
              type: integer
            memory_bytes:
              type: integer
            jobs:
              type: integer
      title: Project
    def-3:
      type: object
      required:
        - id
        - name
        - project
        - version_count
        - created_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        project:
          type: string
        version_count:
          type: integer
        latest_version:
          type:
            - "null"
            - string
        created_at:
          type: string
          format: date-time
      title: Dataset
    def-4:
      type: object
      required:
        - id
        - dataset
        - project
        - version
        - uri
        - created_at
      properties:
        id:
          type: string
          format: uuid
        dataset:
          type: string
        project:
          type: string
        version:
          type: string
        uri:
          type: string
          description: Where the bytes live; never Postgres (ADR 0001)
        digest:
          type:
            - "null"
            - string
          description: Content hash, e.g. sha256:…
        size_bytes:
          type: integer
        created_at:
          type: string
          format: date-time
      title: DatasetVersion
    def-5:
      type: object
      required:
        - id
        - name
        - project
        - reproducibility
        - created_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        project:
          type: string
        reproducibility:
          type: object
          description: Everything needed to rerun this experiment and get the same result
            (spec §34)
          properties:
            git_commit:
              type:
                - "null"
                - string
            image_digest:
              type:
                - "null"
                - string
              description: Immutable image digest; a tag would not pin anything
            dataset:
              type:
                - "null"
                - object
              properties:
                name:
                  type: string
                version:
                  type: string
                version_id:
                  type: string
                  format: uuid
            hyperparameters:
              type: object
              additionalProperties: true
            random_seed:
              type:
                - "null"
                - integer
            observed:
              type: object
              description: What the run reported about itself, as against everything above,
                which is what it was asked for. A record built only from intent
                is a wish; one built only from observation cannot be
                re-requested.
              properties:
                framework:
                  type:
                    - "null"
                    - string
                hardware:
                  type: object
                  additionalProperties: true
                sdk_version:
                  type:
                    - "null"
                    - string
        job_count:
          type: integer
          description: Training jobs recorded against this experiment
        started_at:
          type:
            - "null"
            - string
          format: date-time
        ended_at:
          type:
            - "null"
            - string
          format: date-time
        created_at:
          type: string
          format: date-time
      title: Experiment
    def-6:
      type: object
      required:
        - id
        - name
        - project
        - state
        - priority
        - resources
        - created_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        project:
          type: string
        state:
          type: string
          enum:
            - CREATED
            - QUEUED
            - SCHEDULING
            - STARTING
            - RUNNING
            - FAILED
            - RETRYING
            - CANCELLING
            - SUCCEEDED
            - CANCELLED
        priority:
          type: string
          enum:
            - HIGH
            - MEDIUM
            - LOW
        resources:
          type: object
          properties:
            cpu:
              type: integer
            memory_bytes:
              type: integer
            gpu:
              type: integer
            gpu_memory_min_bytes:
              type: integer
        spec:
          type: object
          additionalProperties: true
        experiment:
          type:
            - "null"
            - object
          description: The reproducibility record this run belongs to, if any
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        attempt:
          type: integer
        max_retries:
          type: integer
        k8s_job_name:
          type:
            - "null"
            - string
          description: Name of the Kubernetes Job running this attempt, once launched
        failure_reason:
          type:
            - "null"
            - string
        pending_reason:
          type:
            - "null"
            - string
          description: Why a launched job is not yet running — an image pull, an
            unschedulable Pod. Cleared once it runs. Not a failure.
        placement:
          type: object
          description: Where the scheduler put this job, and why
          properties:
            node_id:
              type:
                - "null"
                - string
            node_name:
              type:
                - "null"
                - string
            reason:
              type:
                - "null"
                - string
        queued_at:
          type:
            - "null"
            - string
          format: date-time
        started_at:
          type:
            - "null"
            - string
          format: date-time
        finished_at:
          type:
            - "null"
            - string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type:
            - "null"
            - string
          format: date-time
      title: TrainingJob
    def-7:
      type: object
      required:
        - id
        - event_type
        - created_at
      properties:
        id:
          type: integer
        event_type:
          type: string
        from_state:
          type:
            - "null"
            - string
        to_state:
          type:
            - "null"
            - string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
      title: JobEvent
    def-8:
      type: object
      required:
        - id
        - name
        - ready
        - cpu_cores
        - memory_bytes
        - allocated
        - gpus
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        ready:
          type: boolean
        cpu_cores:
          type: integer
        memory_bytes:
          type: integer
        running_jobs:
          type: integer
        gpu_capacity:
          type: integer
          description: GPUs Kubernetes will actually grant. Zero with devices present
            means no device plugin is installed (ADR 0008)
        reserved_cpu:
          type: integer
          description: CPU already requested by pods AshML did not create
        reserved_memory:
          type: integer
        allocated:
          type: object
          description: What AshML has committed on this node, from its own records
          properties:
            cpu:
              type: integer
            memory_bytes:
              type: integer
            gpu:
              type: integer
        schedulable_gpus:
          type: integer
          description: min(advertised, healthy) — what placement may actually use
        free:
          type: object
          description: Capacity minus commitments — what the scheduler places against
          properties:
            cpu:
              type: integer
            memory_bytes:
              type: integer
            gpu:
              type: integer
        gpus:
          type: array
          items:
            type: object
            properties:
              uuid:
                type: string
              index:
                type: integer
              model:
                type: string
              memory_total_bytes:
                type: integer
              memory_used_bytes:
                type: integer
              utilization_pct:
                type: integer
              health:
                type: string
              simulated:
                type: boolean
                description: True when this device is fabricated rather than real hardware
        last_seen_at:
          type:
            - "null"
            - string
          format: date-time
      title: ComputeNode
    def-9:
      type: object
      required:
        - name
        - points
      properties:
        name:
          type: string
        job_id:
          type: string
          format: uuid
          description: Present on experiment reads, where one metric has a series per run
        points:
          type: array
          items:
            type: object
            required:
              - step
              - value
            properties:
              step:
                type: integer
              epoch:
                type:
                  - "null"
                  - integer
              value:
                type: number
              recorded_at:
                type: string
                format: date-time
                description: When the run observed the value, not when the API received it
      title: MetricSeries
    def-10:
      type: object
      required:
        - id
        - kind
        - name
        - uri
        - status
        - created_at
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          description: What this is — `checkpoint`, `model`, or whatever the run calls it
        name:
          type: string
        uri:
          type: string
          description: Where the bytes are; object storage, not this API
        status:
          type: string
          enum:
            - PENDING
            - READY
            - FAILED
          description: PENDING until the upload is confirmed. Only READY means the bytes
            exist — nothing may resume from or serve an artifact in any other
            status.
        digest:
          type:
            - "null"
            - string
          description: Computed by the run as it wrote
        size_bytes:
          type: integer
        step:
          type:
            - "null"
            - integer
          description: Training step, for a checkpoint
        metadata:
          type: object
          additionalProperties: true
        verified:
          type:
            - "null"
            - boolean
          description: Whether AshML asked the store and found the bytes. false means it
            could not ask — no store configured, or a URI outside it — not that
            the check failed. null until the artifact is completed.
        job:
          type:
            - "null"
            - object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        project:
          type:
            - "null"
            - string
        experiment_id:
          type:
            - "null"
            - string
          format: uuid
        created_at:
          type: string
          format: date-time
      title: Artifact
paths:
  /healthz:
    get:
      summary: Liveness probe
      tags:
        - system
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
  /readyz:
    get:
      summary: Readiness probe
      tags:
        - system
      description: Reports ready only when dependencies are reachable. A 503 here
        tells Kubernetes to stop routing traffic without restarting the pod.
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                  database:
                    type: string
        "503":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
  /api/v1/version:
    get:
      summary: Server version and active GPU provider
      tags:
        - system
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - version
                  - gpu_provider
                properties:
                  version:
                    type: string
                  gpu_provider:
                    type: string
  /api/v1/gpus:
    get:
      summary: List GPUs visible to the active provider
      tags:
        - gpus
      description: "Devices with `simulated: true` are fabricated, not real hardware.
        Clients must surface that flag to the user (spec Rule 5)."
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - provider
                  - gpus
                properties:
                  provider:
                    type: string
                  gpus:
                    type: array
                    items:
                      $ref: "#/components/schemas/def-1"
        "503":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
  /api/v1/projects:
    post:
      summary: Create a project
      tags:
        - projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 63
                  pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
                description:
                  type: string
                  maxLength: 1000
                quota:
                  type: object
                  properties:
                    gpu:
                      type: integer
                      minimum: 0
                    cpu:
                      type: integer
                      minimum: 0
                    memory_bytes:
                      type: integer
                      minimum: 0
                    jobs:
                      type: integer
                      minimum: 0
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-2"
        "409":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
    get:
      summary: List projects
      tags:
        - projects
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - projects
                properties:
                  projects:
                    type: array
                    items:
                      $ref: "#/components/schemas/def-2"
  /api/v1/projects/{name}:
    get:
      summary: Get a project by name
      tags:
        - projects
      parameters:
        - schema:
            type: string
          in: path
          name: name
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-2"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
  /api/v1/projects/{name}/quota:
    patch:
      summary: Change a project's resource quota
      tags:
        - projects
      description: Quotas are enforced at admission, before any Kubernetes object
        exists (ADR 0003). A limit of 0 means unlimited. Lowering a limit does
        not stop jobs already running under the old one — it governs the next
        admission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                gpu:
                  type: integer
                  minimum: 0
                cpu:
                  type: integer
                  minimum: 0
                memory_bytes:
                  type: integer
                  minimum: 0
                jobs:
                  type: integer
                  minimum: 0
      parameters:
        - schema:
            type: string
          in: path
          name: name
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-2"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
  /api/v1/projects/{name}/datasets:
    post:
      summary: Create a dataset
      tags:
        - datasets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 63
                  pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
      parameters:
        - schema:
            type: string
          in: path
          name: name
          required: true
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-3"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "409":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
    get:
      summary: List a project's datasets
      tags:
        - datasets
      parameters:
        - schema:
            type: string
          in: path
          name: name
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - datasets
                properties:
                  datasets:
                    type: array
                    items:
                      $ref: "#/components/schemas/def-3"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
  /api/v1/projects/{name}/datasets/{dataset}:
    get:
      summary: Get a dataset
      tags:
        - datasets
      parameters:
        - schema:
            type: string
          in: path
          name: name
          required: true
        - schema:
            type: string
          in: path
          name: dataset
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-3"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
  /api/v1/projects/{name}/datasets/{dataset}/versions:
    post:
      summary: Register a dataset version
      tags:
        - datasets
      description: Versions are immutable. Re-registering an existing version is a 409
        rather than an update, so an experiment pinned to a version always
        describes the same data (spec §34).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - version
                - uri
              additionalProperties: false
              properties:
                version:
                  type: string
                  minLength: 1
                  maxLength: 64
                  pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
                uri:
                  type: string
                  minLength: 1
                  maxLength: 2048
                digest:
                  type: string
                  maxLength: 200
                size_bytes:
                  type: integer
                  minimum: 0
      parameters:
        - schema:
            type: string
          in: path
          name: name
          required: true
        - schema:
            type: string
          in: path
          name: dataset
          required: true
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-4"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "409":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
    get:
      summary: List a dataset's versions, newest first
      tags:
        - datasets
      parameters:
        - schema:
            type: string
          in: path
          name: name
          required: true
        - schema:
            type: string
          in: path
          name: dataset
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - versions
                properties:
                  versions:
                    type: array
                    items:
                      $ref: "#/components/schemas/def-4"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
  /api/v1/projects/{name}/datasets/{dataset}/versions/{version}:
    get:
      summary: Get one dataset version
      tags:
        - datasets
      parameters:
        - schema:
            type: string
          in: path
          name: name
          required: true
        - schema:
            type: string
          in: path
          name: dataset
          required: true
        - schema:
            type: string
          in: path
          name: version
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-4"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
  /api/v1/experiments:
    post:
      summary: Create an experiment
      tags:
        - experiments
      description: Captures the reproducibility record for a run. `dataset` and
        `dataset_version` must be supplied together and must already be
        registered.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - project
                - name
              additionalProperties: false
              properties:
                project:
                  type: string
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                git_commit:
                  type: string
                  maxLength: 40
                image_digest:
                  type: string
                  maxLength: 200
                dataset:
                  type: string
                dataset_version:
                  type: string
                hyperparameters:
                  type: object
                  additionalProperties: true
                random_seed:
                  type: integer
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-5"
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
    get:
      summary: List experiments, newest first
      tags:
        - experiments
      parameters:
        - schema:
            type: string
          in: query
          name: project
          required: false
        - schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
          in: query
          name: limit
          required: false
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - experiments
                properties:
                  experiments:
                    type: array
                    items:
                      $ref: "#/components/schemas/def-5"
  /api/v1/experiments/{id}:
    get:
      summary: Get an experiment
      tags:
        - experiments
      parameters:
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-5"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
  /api/v1/experiments/{id}/report:
    post:
      summary: A run reports its own start or finish
      tags:
        - experiments
      description: Called by the training SDK. `started` stamps `started_at` the first
        time it is reported and records the framework, hardware and SDK the run
        actually observed; `finished` stamps `ended_at`. These timestamps are
        not derived from the job, because a container starting is not training
        starting.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phase
              additionalProperties: false
              properties:
                phase:
                  type: string
                  enum:
                    - started
                    - finished
                framework:
                  type: string
                  maxLength: 200
                hardware:
                  type: object
                  additionalProperties: true
                  description: "What the run found itself running on: GPUs, driver, CUDA"
                sdk_version:
                  type: string
                  maxLength: 50
      parameters:
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-5"
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
  /api/v1/jobs:
    post:
      summary: Submit a training job
      tags:
        - jobs
      description: Creates the job and admits it to the queue in one transaction. The
        executor claims it from there and runs it as a Kubernetes Job.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - project
                - name
                - spec
              additionalProperties: false
              properties:
                project:
                  type: string
                experiment:
                  type: string
                  format: uuid
                  description: Optional experiment to attribute this run to; must be in the same
                    project
                name:
                  type: string
                  minLength: 1
                  maxLength: 63
                  pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
                priority:
                  type: string
                  enum:
                    - HIGH
                    - MEDIUM
                    - LOW
                  default: MEDIUM
                max_retries:
                  type: integer
                  minimum: 0
                  maximum: 10
                  default: 0
                resources:
                  type: object
                  additionalProperties: false
                  properties:
                    cpu:
                      type: integer
                      minimum: 0
                      default: 1
                    memory_bytes:
                      type: integer
                      minimum: 0
                      default: 0
                    gpu:
                      type: integer
                      minimum: 0
                      default: 0
                    gpu_memory_min_bytes:
                      type: integer
                      minimum: 0
                      default: 0
                spec:
                  type: object
                  required:
                    - image
                  properties:
                    image:
                      type: string
                      minLength: 1
                    command:
                      type: array
                      items:
                        type: string
                    args:
                      type: array
                      items:
                        type: string
                    env:
                      type: object
                      additionalProperties:
                        type: string
                  additionalProperties: true
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-6"
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
    get:
      summary: List training jobs
      tags:
        - jobs
      parameters:
        - schema:
            type: string
          in: query
          name: project
          required: false
        - schema:
            type: string
            enum:
              - CREATED
              - QUEUED
              - SCHEDULING
              - STARTING
              - RUNNING
              - FAILED
              - RETRYING
              - CANCELLING
              - SUCCEEDED
              - CANCELLED
          in: query
          name: state
          required: false
        - schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
          in: query
          name: limit
          required: false
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - jobs
                properties:
                  jobs:
                    type: array
                    items:
                      $ref: "#/components/schemas/def-6"
  /api/v1/jobs/{id}:
    get:
      summary: Get a job
      tags:
        - jobs
      parameters:
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-6"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
