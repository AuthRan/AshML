          application/json:
            schema:
              type: object
              required:
                - kind
                - name
              additionalProperties: false
              properties:
                kind:
                  type: string
                  minLength: 1
                  maxLength: 50
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                uri:
                  type: string
                  minLength: 1
                  maxLength: 1000
                  description: Only when the run has arranged its own storage. Omit it and AshML
                    allocates a location and returns a presigned upload.
                step:
                  type: integer
                  minimum: 0
                metadata:
                  type: object
                  additionalProperties: true
      parameters:
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - artifact
                properties:
                  artifact:
                    $ref: "#/components/schemas/def-13"
                  upload:
                    type:
                      - "null"
                      - object
                    description: How to write the bytes. Null when the caller supplied its own
                      `uri`. The URL is time-limited and is not stored —
                      register again to get a fresh one.
                    properties:
                      method:
                        type: string
                      url:
                        type: string
                      expires_at:
                        type: string
                        format: date-time
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "409":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
    get:
      summary: List what a job produced
      tags:
        - artifacts
      parameters:
        - schema:
            type: string
          in: query
          name: kind
          required: false
        - schema:
            type: string
            enum:
              - PENDING
              - READY
              - FAILED
          in: query
          name: status
          required: false
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - artifacts
                properties:
                  artifacts:
                    type: array
                    items:
                      $ref: "#/components/schemas/def-13"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
  /api/v1/artifacts/{id}/complete:
    post:
      summary: Confirm an artifact’s bytes have landed
      tags:
        - artifacts
      description: "Moves PENDING to READY. AshML asks the store whether the object is
        actually there and how big it is: an upload that never landed is
        refused, and so is a size that disagrees with what is stored. Where the
        URI is outside the configured store the artifact still completes, marked
        `verified: false`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - digest
                - size_bytes
              additionalProperties: false
              properties:
                digest:
                  type: string
                  minLength: 1
                  maxLength: 200
                size_bytes:
                  type: integer
                  minimum: 0
                metadata:
                  type: object
                  additionalProperties: true
                  description: Merged into what registration recorded, not replacing it
      parameters:
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-13"
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "409":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
  /api/v1/artifacts/{id}/fail:
    post:
      summary: Record that an artifact’s upload was abandoned
      tags:
        - artifacts
      description: Moves PENDING to FAILED. The row is kept, so a checkpoint the run
        meant to write and did not stays visible rather than looking like it was
        never tried.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type:
                - object
                - "null"
              additionalProperties: false
              properties:
                reason:
                  type: string
                  maxLength: 500
      parameters:
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-13"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "409":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
  /api/v1/artifacts/{id}/download:
    get:
      summary: Get a time-limited URL to read an artifact
      tags:
        - artifacts
      description: "The bytes are served by object storage, not by this API. Only
        READY artifacts can be signed for: a link to a PENDING one would resolve
        to nothing, or worse, to a partial checkpoint that loads."
      parameters:
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - url
                  - expires_at
                properties:
                  artifact_id:
                    type: string
                    format: uuid
                  uri:
                    type: string
                  url:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "409":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
  /api/v1/artifacts/{id}:
    get:
      summary: Get an artifact
      tags:
        - artifacts
      parameters:
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-13"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
  /api/v1/experiments/{id}/artifacts:
    get:
      summary: List what every run of an experiment produced
      tags:
