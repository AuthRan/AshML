                $ref: "#/components/schemas/def-0"
  /api/v1/experiments/{id}/metrics:
    get:
      summary: Read metrics across every run of an experiment
      tags:
        - metrics
      description: "One series per metric per job. Runs are kept apart rather than
        merged: two runs both report from step 0, and combining them would draw
        a curve that never existed."
