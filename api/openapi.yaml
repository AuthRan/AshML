            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "409":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
  /api/v1/jobs/{id}/scheduling:
    get:
      summary: Explain why a job was, or was not, scheduled
      tags:
        - jobs
      description: Every node the scheduler considered on each of the most recent
        passes, and what was wrong with the ones it rejected. This is the answer
        to "why is my job still queued" — a question a single placement summary
        cannot answer once the situation that produced it has passed.
      parameters:
        - schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 5
          in: query
          name: passes
          required: false
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - job_id
                  - state
                  - passes
                properties:
                  job_id:
                    type: string
                    format: uuid
                  state:
                    type: string
                    enum:
                      - CREATED
                      - QUEUED
                      - SCHEDULING
                      - STARTING
                      - RUNNING
                      - FAILED
                      - RETRYING
                      - CANCELLING
                      - SUCCEEDED
                      - CANCELLED
                  placement:
                    type: object
                    properties:
                      node_id:
                        type:
                          - "null"
                          - string
                      node_name:
                        type:
                          - "null"
                          - string
                      reason:
                        type:
                          - "null"
                          - string
                  passes:
                    type: array
                    items:
                      type: object
                      properties:
                        pass_id:
                          type: string
                        attempt:
                          type: integer
                        at:
                          type: string
                          format: date-time
                        last_seen_at:
                          type:
                            - "null"
                            - string
                          format: date-time
                        repeat_count:
                          type: integer
                          description: How many consecutive passes reached this same verdict. Identical
                            refusals are folded together rather than repeated.
                        decisions:
                          type: array
                          items:
                            type: object
                            properties:
                              node_id:
                                type:
                                  - "null"
                                  - string
                              node_name:
                                type:
                                  - "null"
                                  - string
                              outcome:
                                type: string
                                enum:
                                  - SELECTED
                                  - VIABLE
                                  - REJECTED
                                  - NO_CAPACITY
                                  - QUOTA_EXCEEDED
                              reason:
                                type: string
                              details:
                                type: object
                                additionalProperties: true
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
  /api/v1/jobs/{id}/logs:
    get:
      summary: Read a job's container logs
      tags:
        - jobs
      description: "Returns the training container's stdout/stderr as read from
        Kubernetes. Logs live in the cluster, not in AshML: once the Pod is
        garbage-collected they are gone, which is why the response says whether
        they are still available rather than returning an empty string."
      parameters:
        - schema:
            type: integer
            minimum: 1
            maximum: 10000
          in: query
          name: tail
          required: false
          description: Return only the most recent N lines
        - schema:
            type: boolean
            default: false
          in: query
          name: previous
          required: false
          description: Read the previous container instance instead of the current one —
            where the output of a crashed run is found
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - job_id
                  - available
                  - logs
                properties:
                  job_id:
                    type: string
                    format: uuid
                  state:
                    type: string
                    enum:
                      - CREATED
                      - QUEUED
                      - SCHEDULING
                      - STARTING
                      - RUNNING
                      - FAILED
                      - RETRYING
                      - CANCELLING
                      - SUCCEEDED
                      - CANCELLED
                  k8s_job_name:
                    type:
                      - "null"
                      - string
                  available:
                    type: boolean
                    description: False when no Pod exists to read logs from
                  reason:
                    type:
                      - "null"
                      - string
                    description: Why logs are unavailable, when they are not
                  logs:
                    type: string
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
  /api/v1/nodes:
    get:
      summary: List compute nodes and their capacity
      tags:
        - nodes
      description: The cluster as the scheduler sees it. `allocated` comes from
        AshML's own job records rather than from the node's reported usage,
        which lags — a Pod created a moment ago has not appeared in it yet.
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - nodes
                properties:
                  nodes:
                    type: array
                    items:
                      $ref: "#/components/schemas/def-8"
  /api/v1/jobs/{id}/metrics:
    post:
      summary: Report training metrics for a job
      tags:
        - metrics
      description: "Called by the training process itself. Metrics are append-only:
        reporting the same step twice records both points rather than replacing
        the first. The experiment is taken from the job, not from the request."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - metrics
              additionalProperties: false
              properties:
                metrics:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items:
                    type: object
                    required:
                      - name
                      - value
                      - step
                    additionalProperties: false
                    properties:
                      name:
                        type: string
                        minLength: 1
                        maxLength: 200
                      value:
                        type: number
                      step:
                        type: integer
                        minimum: 0
                      epoch:
                        type: integer
                        minimum: 0
                      recorded_at:
                        type: string
                        format: date-time
      parameters:
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - written
                  - job_id
                properties:
                  written:
                    type: integer
                  job_id:
                    type: string
                    format: uuid
                  experiment_id:
                    type:
                      - "null"
                      - string
                    format: uuid
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "409":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
    get:
      summary: Read a job’s metric series
      tags:
        - metrics
      parameters:
        - schema:
            type: string
          in: query
          name: name
          required: false
          description: Return only this metric
        - schema:
            type: integer
            minimum: 0
          in: query
          name: since_step
          required: false
          description: Only points after this step, for polling a live run
        - schema:
            type: integer
            minimum: 1
            maximum: 20000
            default: 2000
          in: query
          name: limit
          required: false
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - series
                properties:
                  job_id:
                    type: string
                    format: uuid
                  experiment_id:
                    type: string
                    format: uuid
                  series:
                    type: array
                    items:
                      $ref: "#/components/schemas/def-9"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
  /api/v1/jobs/{id}/metrics/summary:
    get:
      summary: Latest value and point count per metric
      tags:
        - metrics
      description: Answers "how is this run doing" without transferring the series.
      parameters:
