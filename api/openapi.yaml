  /api/v1/experiments/{id}/report:
    post:
      summary: A run reports its own start or finish
      tags:
        - experiments
      description: Called by the training SDK. `started` stamps `started_at` the first
        time it is reported and records the framework, hardware and SDK the run
        actually observed; `finished` stamps `ended_at`. These timestamps are
        not derived from the job, because a container starting is not training
        starting.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phase
              additionalProperties: false
              properties:
                phase:
                  type: string
                  enum:
                    - started
                    - finished
                framework:
                  type: string
                  maxLength: 200
                hardware:
                  type: object
                  additionalProperties: true
                  description: "What the run found itself running on: GPUs, driver, CUDA"
                sdk_version:
                  type: string
                  maxLength: 50
      parameters:
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-7"
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
  /api/v1/jobs:
    post:
      summary: Submit a training job
      tags:
        - jobs
      description: Creates the job and admits it to the queue in one transaction. The
        executor claims it from there and runs it as a Kubernetes Job.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - project
                - name
                - spec
              additionalProperties: false
              properties:
                project:
                  type: string
                experiment:
                  type: string
                  format: uuid
                  description: Optional experiment to attribute this run to; must be in the same
                    project
                name:
                  type: string
                  minLength: 1
                  maxLength: 63
                  pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
                priority:
                  type: string
                  enum:
                    - HIGH
                    - MEDIUM
                    - LOW
                  default: MEDIUM
                max_retries:
                  type: integer
                  minimum: 0
                  maximum: 10
                  default: 0
                resources:
                  type: object
                  additionalProperties: false
                  properties:
                    cpu:
                      type: integer
                      minimum: 0
                      default: 1
                    memory_bytes:
                      type: integer
                      minimum: 0
                      default: 0
                    gpu:
                      type: integer
                      minimum: 0
                      default: 0
                    gpu_memory_min_bytes:
                      type: integer
                      minimum: 0
                      default: 0
                spec:
                  type: object
                  required:
                    - image
                  properties:
                    image:
                      type: string
                      minLength: 1
                    command:
                      type: array
                      items:
                        type: string
                    args:
                      type: array
                      items:
                        type: string
                    env:
                      type: object
                      additionalProperties:
                        type: string
                  additionalProperties: true
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-8"
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
    get:
      summary: List training jobs
      tags:
        - jobs
      parameters:
        - schema:
            type: string
          in: query
          name: project
          required: false
        - schema:
            type: string
            enum:
              - CREATED
              - QUEUED
              - SCHEDULING
              - STARTING
              - RUNNING
              - FAILED
              - RETRYING
              - CANCELLING
              - SUCCEEDED
              - CANCELLED
          in: query
          name: state
          required: false
        - schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
          in: query
          name: limit
          required: false
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
