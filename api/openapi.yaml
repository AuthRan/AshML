openapi: 3.1.0
info:
  title: AshML API
  description: >-
    Control-plane API for the AshML Kubernetes-native GPU ML platform. Generated
    from the route schemas — do not edit by hand.


    Default deny: every `/api/v1` request needs `Authorization: Bearer <token>`.
    A person gets one from `ash token create`; the first one comes from `make
    token`, which writes it straight to the database because the endpoint that
    mints tokens needs one itself. Training and serving pods are handed their
    own scoped credentials by the platform and do not use these.


    Every response except the probe and scrape endpoints carries
    `RateLimit-Limit`, `RateLimit-Remaining` and `RateLimit-Reset` — those three
    are exempt, because a throttled health probe is a restart. Over budget is
    `429` with `Retry-After`, and a refused request is not itself charged, so
    backing off for that long is enough. An authenticated caller is counted by
    identity rather than by token; requests with no valid credential are
    counted, far more tightly, by source address.
  version: 0.1.0-dev
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: An AshML API token. See `ash token create`.
  schemas:
    def-0:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Stable, machine-readable error code
            message:
              type: string
      title: Error
    def-1:
      type: object
      required:
        - provider
        - index
        - uuid
        - model
        - memory_total_bytes
        - memory_used_bytes
        - memory_free_bytes
        - utilization_pct
        - health
        - simulated
      properties:
        provider:
          type: string
          description: Provider that discovered this device
        index:
          type: integer
          minimum: 0
        uuid:
          type: string
        model:
          type: string
        memory_total_bytes:
          type: integer
          minimum: 0
        memory_used_bytes:
          type: integer
          minimum: 0
        memory_free_bytes:
          type: integer
          minimum: 0
        utilization_pct:
          type: integer
          minimum: 0
          maximum: 100
        temperature_c:
          type: integer
        power_watts:
          type: number
        health:
          type: string
          enum:
            - OK
            - DEGRADED
            - FAILED
            - UNKNOWN
        simulated:
          type: boolean
          description: "True when this device is fabricated rather than real hardware.
            Never hide this: the spec forbids passing simulated telemetry off as
            real (Rule 5)."
      title: GpuDevice
    def-2:
      type: object
      required:
        - id
        - name
        - prefix
        - created_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type:
            - "null"
            - string
          format: date-time
        expires_at:
          type:
            - "null"
            - string
          format: date-time
      title: ApiToken
    def-3:
      type: object
      required:
        - email
        - role
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
        display_name:
          type: string
        role:
          type: string
          enum:
            - VIEWER
            - EDITOR
            - OWNER
        created_at:
          type: string
          format: date-time
      title: ProjectMember
    def-4:
      type: object
      required:
        - id
        - name
        - created_at
        - quota
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        created_at:
          type: string
          format: date-time
        quota:
          type: object
          required:
            - gpu
            - cpu
            - memory_bytes
            - jobs
          properties:
            gpu:
              type: integer
            cpu:
              type: integer
            memory_bytes:
              type: integer
            jobs:
              type: integer
      title: Project
    def-5:
      type: object
      required:
        - id
        - name
        - project
        - version_count
        - created_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        project:
          type: string
        version_count:
          type: integer
        latest_version:
          type:
            - "null"
            - string
        created_at:
          type: string
          format: date-time
      title: Dataset
    def-6:
      type: object
      required:
        - id
        - dataset
        - project
        - version
        - uri
        - created_at
      properties:
        id:
          type: string
          format: uuid
        dataset:
          type: string
        project:
          type: string
        version:
          type: string
        uri:
          type: string
          description: Where the bytes live; never Postgres (ADR 0001)
        digest:
          type:
            - "null"
            - string
          description: Content hash, e.g. sha256:…
        size_bytes:
          type: integer
        created_at:
          type: string
          format: date-time
      title: DatasetVersion
    def-7:
      type: object
      required:
        - id
        - name
        - project
        - reproducibility
        - created_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        project:
          type: string
        reproducibility:
          type: object
          description: Everything needed to rerun this experiment and get the same result
            (spec §34)
          properties:
            git_commit:
              type:
                - "null"
                - string
            image_digest:
              type:
                - "null"
                - string
              description: Immutable image digest; a tag would not pin anything
            dataset:
              type:
                - "null"
                - object
              properties:
                name:
                  type: string
                version:
                  type: string
                version_id:
                  type: string
                  format: uuid
            hyperparameters:
              type: object
              additionalProperties: true
            random_seed:
              type:
                - "null"
                - integer
            observed:
              type: object
              description: What the run reported about itself, as against everything above,
                which is what it was asked for. A record built only from intent
                is a wish; one built only from observation cannot be
                re-requested.
              properties:
                framework:
                  type:
                    - "null"
                    - string
                hardware:
                  type: object
                  additionalProperties: true
                sdk_version:
                  type:
                    - "null"
                    - string
        job_count:
          type: integer
          description: Training jobs recorded against this experiment
        started_at:
          type:
            - "null"
            - string
          format: date-time
        ended_at:
          type:
            - "null"
            - string
          format: date-time
        created_at:
          type: string
          format: date-time
      title: Experiment
    def-8:
      type: object
      required:
        - id
        - name
        - project
        - state
        - priority
        - resources
        - created_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        project:
          type: string
        state:
          type: string
          enum:
            - CREATED
            - QUEUED
            - SCHEDULING
            - STARTING
            - RUNNING
            - FAILED
            - RETRYING
            - CANCELLING
            - SUCCEEDED
            - CANCELLED
        priority:
          type: string
          enum:
            - HIGH
            - MEDIUM
            - LOW
        resources:
          type: object
          properties:
            cpu:
              type: integer
            memory_bytes:
              type: integer
            gpu:
              type: integer
            gpu_memory_min_bytes:
              type: integer
        spec:
          type: object
          additionalProperties: true
        experiment:
          type:
            - "null"
            - object
          description: The reproducibility record this run belongs to, if any
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        attempt:
          type: integer
        max_retries:
          type: integer
        k8s_job_name:
          type:
            - "null"
            - string
          description: Name of the Kubernetes Job running this attempt, once launched
        failure_reason:
          type:
            - "null"
            - string
        pending_reason:
          type:
            - "null"
            - string
          description: Why a launched job is not yet running — an image pull, an
            unschedulable Pod. Cleared once it runs. Not a failure.
        placement:
          type: object
          description: Where the scheduler put this job, and why
          properties:
            node_id:
              type:
                - "null"
                - string
            node_name:
              type:
                - "null"
                - string
            reason:
              type:
                - "null"
                - string
        queued_at:
          type:
            - "null"
            - string
          format: date-time
        started_at:
          type:
            - "null"
            - string
          format: date-time
        finished_at:
          type:
            - "null"
            - string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type:
            - "null"
            - string
          format: date-time
      title: TrainingJob
    def-9:
      type: object
      required:
        - id
        - event_type
        - created_at
      properties:
        id:
          type: integer
        event_type:
          type: string
        from_state:
          type:
            - "null"
            - string
        to_state:
          type:
            - "null"
            - string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
      title: JobEvent
    def-10:
      type: object
      required:
        - id
        - name
        - ready
        - cpu_cores
        - memory_bytes
        - allocated
        - gpus
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        ready:
          type: boolean
        cpu_cores:
          type: integer
        memory_bytes:
          type: integer
        running_jobs:
          type: integer
        gpu_capacity:
          type: integer
          description: GPUs Kubernetes will actually grant. Zero with devices present
            means no device plugin is installed (ADR 0008)
        reserved_cpu:
          type: integer
          description: CPU already requested by pods AshML did not create
        reserved_memory:
          type: integer
        allocated:
          type: object
          description: What AshML has committed on this node, from its own records
          properties:
            cpu:
              type: integer
            memory_bytes:
              type: integer
            gpu:
              type: integer
        schedulable_gpus:
          type: integer
          description: min(advertised, healthy) — what placement may actually use
        free:
          type: object
          description: Capacity minus commitments — what the scheduler places against
          properties:
            cpu:
              type: integer
            memory_bytes:
              type: integer
            gpu:
              type: integer
        gpus:
          type: array
          items:
            type: object
            properties:
              uuid:
                type: string
              index:
                type: integer
              model:
                type: string
              memory_total_bytes:
                type: integer
              memory_used_bytes:
                type: integer
              utilization_pct:
                type: integer
              health:
                type: string
              simulated:
                type: boolean
                description: True when this device is fabricated rather than real hardware
        last_seen_at:
          type:
            - "null"
            - string
          format: date-time
      title: ComputeNode
    def-11:
      type: object
      required:
        - id
        - name
        - project
        - model
        - status
        - created_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        project:
          type: string
        model:
          type: string
        status:
          type: string
          enum:
            - PENDING
            - PROGRESSING
            - READY
            - DEGRADED
            - FAILED
            - STOPPED
          description: What the cluster reports, not what was asked for. PROGRESSING means
            the objects exist but no pod has loaded a model yet; DEGRADED means
            it was serving and is now short of replicas.
        image:
          type: string
        replicas:
          type: integer
          description: Replicas asked for, per version. Each target runs this many.
        ready_replicas:
          type: integer
          description: Replicas that passed their readiness probe — which for a model
            server means the weights are loaded, not merely that the pod exists
            — summed over the versions taking traffic
        cpu:
          type: number
        memory_bytes:
          type: integer
        gpu:
          type: integer
        endpoint_url:
          type:
            - "null"
            - string
          description: The in-cluster address. Null means nothing is listening yet.
        k8s_name:
          type:
            - "null"
            - string
        namespace:
          type:
            - "null"
            - string
        last_error:
          type:
            - "null"
            - string
          description: Why it is not serving. Cleared when it is, so it cannot go stale.
        serving_version:
          type:
            - "null"
            - integer
          description: "The version the deployment's address currently resolves to. This
            is observed state: during a switch it is still the outgoing version,
            which is the one actually answering, and it lags what the targets
            ask for until the incoming version has a ready pod."
        targets:
          type: array
          description: The model versions this deployment serves, and the share of traffic
            each is meant to take. Weights sum to 100 and are never normalised;
            a version at 0 is out of rotation and scaled to no pods, kept so
            that putting it back is a weight change rather than a redeploy.
          items:
            type: object
            properties:
              model_version_id:
                type: string
                format: uuid
              version:
                type: integer
              version_status:
                type: string
              traffic_weight:
                type: integer
              replicas:
                type: integer
              status:
                type: string
                enum:
                  - PENDING
                  - PROGRESSING
                  - READY
                  - DEGRADED
                  - FAILED
                  - STOPPED
                description: This version's own pods, observed separately from the deployment's
              ready_replicas:
                type: integer
              last_error:
                type:
                  - "null"
                  - string
              k8s_name:
                type:
                  - "null"
                  - string
              endpoint_url:
                type:
                  - "null"
                  - string
                description: This version's own address. Not the one callers use — that is the
                  deployment's — but the one traffic is forwarded to.
              artifact_id:
                type: string
                format: uuid
              artifact_status:
                type: string
              arch:
                type:
                  - "null"
                  - string
                description: The architecture the training run recorded on the artifact
        router_status:
          type:
            - "null"
            - string
          enum:
            - PENDING
            - PROGRESSING
            - READY
            - DEGRADED
            - FAILED
            - STOPPED
            - null
          description: The router's own pods, when there is a router. It is in front of
            every request once a deployment splits traffic, so its health is
            part of the deployment's and is observed rather than assumed.
        router_ready_replicas:
          type: integer
        router_k8s_name:
          type:
            - "null"
            - string
        dropped_versions:
          type: array
          items:
            type: integer
          description: Versions this deploy took out of rotation. Deploying is a rollout
            to 100%, so anything that was taking traffic stops — named here
            rather than dropping to zero quietly. They keep their rows and their
            objects, at no replicas.
        created_at:
          type: string
          format: date-time
        updated_at:
          type:
            - "null"
            - string
          format: date-time
      title: Deployment
    def-12:
      type: object
      required:
        - name
        - points
      properties:
        name:
          type: string
        job_id:
          type: string
          format: uuid
          description: Present on experiment reads, where one metric has a series per run
        points:
          type: array
          items:
            type: object
            required:
              - step
              - value
            properties:
              step:
                type: integer
              epoch:
                type:
                  - "null"
                  - integer
              value:
                type: number
              recorded_at:
                type: string
                format: date-time
                description: When the run observed the value, not when the API received it
      title: MetricSeries
    def-13:
      type: object
      required:
        - id
        - kind
        - name
        - uri
        - status
        - created_at
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          description: What this is — `checkpoint`, `model`, or whatever the run calls it
        name:
          type: string
        uri:
          type: string
          description: Where the bytes are; object storage, not this API
        status:
          type: string
          enum:
            - PENDING
            - READY
            - FAILED
          description: PENDING until the upload is confirmed. Only READY means the bytes
            exist — nothing may resume from or serve an artifact in any other
            status.
        digest:
          type:
            - "null"
            - string
          description: Computed by the run as it wrote
        size_bytes:
          type: integer
        step:
          type:
            - "null"
            - integer
          description: Training step, for a checkpoint
        metadata:
          type: object
          additionalProperties: true
        verified:
          type:
            - "null"
            - boolean
          description: Whether AshML asked the store and found the bytes. false means it
            could not ask — no store configured, or a URI outside it — not that
            the check failed. null until the artifact is completed.
        job:
          type:
            - "null"
            - object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        project:
          type:
            - "null"
            - string
        experiment_id:
          type:
            - "null"
            - string
          format: uuid
        created_at:
          type: string
          format: date-time
      title: Artifact
    def-14:
      type: object
      required:
        - id
        - name
        - project
        - created_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        project:
          type: string
        version_count:
          type: integer
        latest_version:
          type:
            - "null"
            - integer
        production_version:
          type:
            - "null"
            - integer
          description: The version this model currently means. At most one, ever.
        created_at:
          type: string
          format: date-time
      title: Model
    def-15:
      type: object
      required:
        - id
        - model
        - version
        - status
        - created_at
      properties:
        id:
          type: string
          format: uuid
        model:
          type: string
        project:
          type: string
        version:
          type: integer
        status:
          type: string
          enum:
            - CREATED
            - STAGING
            - PRODUCTION
            - ARCHIVED
        description:
          type:
            - "null"
            - string
        metrics:
          type: object
          additionalProperties: true
          description: The run’s own last reported value per metric, copied here so two
            versions can be compared without going back to their jobs
        artifact:
          type:
            - "null"
            - object
          description: The bytes this version is. Always READY — a version cannot be
            registered otherwise.
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            uri:
              type: string
            digest:
              type:
                - "null"
                - string
            size_bytes:
              type: integer
            status:
              type: string
            verified:
              type:
                - "null"
                - boolean
              description: Whether AshML checked the bytes itself, rather than the run
                claiming so
        experiment_id:
          type:
            - "null"
            - string
          format: uuid
        job_id:
          type:
            - "null"
            - string
          format: uuid
        promoted_at:
          type:
            - "null"
            - string
          format: date-time
          description: When this version first entered PRODUCTION
        created_at:
          type: string
          format: date-time
      title: ModelVersion
paths:
  /healthz:
    get:
      summary: Liveness probe
      tags:
        - system
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
  /readyz:
    get:
      summary: Readiness probe
      tags:
        - system
      description: Reports ready only when dependencies are reachable. A 503 here
        tells Kubernetes to stop routing traffic without restarting the pod.
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                  database:
                    type: string
        "503":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
  /api/v1/version:
    get:
      summary: Server version and active GPU provider
      tags:
        - system
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - version
                  - gpu_provider
                properties:
                  version:
                    type: string
                  gpu_provider:
                    type: string
  /api/v1/auth/whoami:
    get:
      summary: Who this token belongs to, and what it can reach
      tags:
        - auth
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - kind
                properties:
                  kind:
                    type: string
                    enum:
                      - USER
                      - RUN
                      - SERVING
                  user_id:
                    type: string
                  email:
                    type: string
                  is_admin:
                    type: boolean
                  projects:
                    type: array
                    items:
                      type: object
                      properties:
                        project_id:
                          type: string
                        role:
                          type: string
                  job_id:
                    type: string
                  attempt:
                    type: integer
                  deployment_id:
                    type: string
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
  /api/v1/auth/tokens:
    post:
      summary: Create an API token
      tags:
        - auth
      description: The plaintext token is returned once, in this response, and is
        never retrievable again — only its SHA-256 hash is stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                expires_in_days:
                  type: integer
                  minimum: 1
                  maximum: 3650
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - token
                  - name
                  - prefix
                properties:
                  token:
                    type: string
                    description: Shown once. Store it now.
                  id:
                    type: string
                  name:
                    type: string
                  prefix:
                    type: string
                  created_at:
                    type: string
                  expires_at:
                    type:
                      - "null"
                      - string
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "409":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
    get:
      summary: List your live API tokens
      tags:
        - auth
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - tokens
                properties:
                  tokens:
                    type: array
                    items:
                      $ref: "#/components/schemas/def-2"
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
  /api/v1/auth/tokens/{token}:
    delete:
      summary: Revoke one of your API tokens
      tags:
        - auth
      parameters:
        - schema:
            type: string
          in: path
          name: token
          required: true
          description: The token's name
      responses:
        "204":
          description: Default Response
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "404":
          description: Default Response
          content:
