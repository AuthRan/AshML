        - schema:
            type: string
          in: query
          name: name
          required: false
        - schema:
            type: integer
            minimum: 1
            maximum: 20000
            default: 2000
          in: query
          name: limit
          required: false
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - series
                properties:
                  job_id:
                    type: string
                    format: uuid
                  experiment_id:
                    type: string
                    format: uuid
                  series:
                    type: array
                    items:
