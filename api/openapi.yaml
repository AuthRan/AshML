      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-10"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
  /api/v1/experiments/{id}/artifacts:
    get:
      summary: List what every run of an experiment produced
      tags:
        - artifacts
      parameters:
        - schema:
            type: string
          in: query
          name: kind
          required: false
        - schema:
            type: string
            enum:
              - PENDING
              - READY
              - FAILED
          in: query
          name: status
          required: false
        - schema:
            type: string
