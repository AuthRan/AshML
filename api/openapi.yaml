  /api/v1/projects/{name}/deployments/{deployment}/rollout:
    post:
      summary: Move a share of the traffic onto one version
      tags:
        - deployments
      description: >-
        Names one version and the share it should take; the rest of the split is
        taken from the other versions in proportion to what they already have.
        Weights are shares of traffic, not replica counts, and they always sum
        to exactly 100 — they are never normalised, because a share adjusted for
        you is a split you did not choose.


        A version not already served is added, and is validated exactly as
        deploying it would be: a canary that fails because its artifact was
        never confirmed looks like the model is bad, which is the worst possible
        outcome for a mechanism whose only purpose is to find out whether the
        model is bad.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - version
                - traffic
              properties:
                version:
                  type: integer
                  minimum: 1
                traffic:
                  type: integer
                  minimum: 0
                  maximum: 100
      parameters:
        - schema:
            type: string
          in: path
          name: name
          required: true
        - schema:
            type: string
          in: path
          name: deployment
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-11"
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "409":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
  /api/v1/projects/{name}/deployments/{deployment}/promote:
    post:
      summary: "End a rollout: one version takes all the traffic"
      tags:
        - deployments
      description: The other versions go to weight 0 rather than being removed, so the
        version that was serving a minute ago is still there to go back to.
        Removing one is `retire`, and it is deliberately a separate decision.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
