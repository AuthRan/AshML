                image:
                  type: string
                cpu:
                  type: number
                  minimum: 0
                memory_bytes:
                  type: integer
                  minimum: 0
                gpu:
                  type: integer
                  minimum: 0
                arch:
                  type: string
                  description: Overrides the architecture recorded on the artifact
      parameters:
        - schema:
            type: string
          in: path
          name: name
          required: true
        - schema:
            type: string
          in: path
          name: model
          required: true
