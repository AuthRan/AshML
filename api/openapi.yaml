    post:
      summary: Deploy a model version
      tags:
        - deployments
      description: Creates the Kubernetes Deployment and Service that serve a version,
        or updates them if this deployment name already exists — which is how a
        new version is rolled out without dropping traffic. With no version
        given, the one in PRODUCTION is deployed; if none is promoted this fails
        rather than quietly serving the newest.
