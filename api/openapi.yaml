                  - expires_at
                properties:
                  artifact_id:
                    type: string
                    format: uuid
                  uri:
                    type: string
                  url:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "409":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
  /api/v1/artifacts/{id}:
    get:
      summary: Get an artifact
      tags:
