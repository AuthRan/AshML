  /api/v1/jobs/{id}/scheduling:
    get:
      summary: Explain why a job was, or was not, scheduled
      tags:
        - jobs
      description: Every node the scheduler considered on each of the most recent
        passes, and what was wrong with the ones it rejected. This is the answer
        to "why is my job still queued" — a question a single placement summary
        cannot answer once the situation that produced it has passed.
      parameters:
        - schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 5
          in: query
          name: passes
          required: false
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - job_id
                  - state
                  - passes
                properties:
                  job_id:
                    type: string
                    format: uuid
                  state:
                    type: string
                    enum:
                      - CREATED
                      - QUEUED
                      - SCHEDULING
                      - STARTING
                      - RUNNING
                      - FAILED
                      - RETRYING
                      - CANCELLING
                      - SUCCEEDED
                      - CANCELLED
                  placement:
                    type: object
                    properties:
                      node_id:
                        type:
                          - "null"
                          - string
                      node_name:
                        type:
                          - "null"
                          - string
                      reason:
                        type:
                          - "null"
                          - string
                  passes:
                    type: array
                    items:
                      type: object
                      properties:
                        pass_id:
                          type: string
                        attempt:
                          type: integer
                        at:
                          type: string
                          format: date-time
                        last_seen_at:
                          type:
                            - "null"
                            - string
                          format: date-time
                        repeat_count:
                          type: integer
                          description: How many consecutive passes reached this same verdict. Identical
                            refusals are folded together rather than repeated.
                        decisions:
                          type: array
                          items:
                            type: object
                            properties:
                              node_id:
                                type:
                                  - "null"
                                  - string
                              node_name:
                                type:
                                  - "null"
                                  - string
                              outcome:
                                type: string
                                enum:
                                  - SELECTED
                                  - VIABLE
                                  - REJECTED
                                  - NO_CAPACITY
                                  - QUOTA_EXCEEDED
                              reason:
                                type: string
                              details:
                                type: object
                                additionalProperties: true
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
  /api/v1/jobs/{id}/logs:
    get:
      summary: Read a job's container logs
      tags:
        - jobs
      description: "Returns the training container's stdout/stderr as read from
        Kubernetes. Logs live in the cluster, not in AshML: once the Pod is
        garbage-collected they are gone, which is why the response says whether
        they are still available rather than returning an empty string."
      parameters:
        - schema:
            type: integer
            minimum: 1
            maximum: 10000
          in: query
          name: tail
          required: false
          description: Return only the most recent N lines
