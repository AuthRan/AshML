  /api/v1/deployments/{id}/routing:
    get:
      summary: The traffic split a router should apply
      tags:
        - deployments
      description: >-
        Read by the model router, once every few seconds, and by nothing else.
        It is addressed by **id** rather than by project and name because that
        is what the router pod is given: a name is a thing an operator can
        change, and a router asking about a name that has moved would quietly
        stop working at the exact moment nobody was watching it.


        The document is deliberately small. Everything a router needs to choose
        a target and nothing it does not — no artifact metadata, no status
        history, no resource limits. It is fetched on a timer by every router
        pod, and a payload that grew with the deployment would make that a cost
        that grew too.
      parameters:
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - deployment_id
                  - targets
                properties:
                  deployment_id:
                    type: string
                    format: uuid
                  deployment:
                    type: string
                  model:
                    type: string
                  updated_at:
                    type:
                      - "null"
                      - string
                    format: date-time
                  targets:
                    type: array
                    items:
                      type: object
                      properties:
                        version:
                          type: integer
                        weight:
                          type: integer
                          description: Share of traffic, 0-100. The weights sum to exactly 100.
                        url:
                          type:
                            - "null"
                            - string
                          description: This version's own in-cluster Service
                        ready:
                          type: boolean
                          description: What AshML last observed, which is up to a sync interval old. A
                            hint the router uses to keep traffic off a version
                            whose pods are not up — never a reason to keep it
                            off one that has come back, since the router finds
                            that out first.
                        artifact_id:
                          type:
                            - "null"
                            - string
                          format: uuid
                        model_version_id:
                          type: string
                          format: uuid
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
  /api/v1/projects/{name}/deployments:
    get:
      summary: List a project's deployments
      tags:
        - deployments
      parameters:
        - schema:
            type: string
          in: path
